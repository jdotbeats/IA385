services:

  taskmaster-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmaster-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  python-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: taskmaster-python
    ports:
      - "5000:5000"
